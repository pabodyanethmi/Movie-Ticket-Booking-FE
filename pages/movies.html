<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies & Showtimes | CineX</title>
  <meta name="description" content="Explore the full CineX cinema catalog, filter by genre and language, watch trailers, and reserve showtimes.">
  
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/dark-theme.css">
</head>
<body>

  <header class="header-nav-scope">
    <div class="nav-scope-container">
      
      <div class="nav-left-group">
        <a href="../index.html" class="brand-logo" aria-label="CineX Home">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <span class="logo-text">CINEX</span>
          <span class="logo-accent">.</span>
        </a>
      </div>

      <div class="nav-center nav-search-wrapper nav-center-group">
        <div class="nav-socials social-icons-bar social-icons">
          <a href="#" class="social-icon-btn" aria-label="Facebook">
            <svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
          </a>
          <a href="#" class="social-icon-btn" aria-label="Instagram">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
          </a>
          <a href="#" class="social-icon-btn" aria-label="YouTube">
            <svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
          </a>
        </div>

        <div class="search-box-container search-toggle-wrap nav-search">
          <svg class="search-icon-inside" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="globalSearchInput" class="search-input-header" placeholder="Search movie...">
        </div>

        <div id="navUserActionsCenter" class="nav-user-controls">
          <a href="#" onclick="event.preventDefault(); openAuthModal('login');" class="user-avatar" title="Sign In / Profile">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </a>
        </div>
      </div>

      <div class="nav-right-group">
        <ul class="nav-links">
          <li><a href="../index.html" class="nav-link">HOME</a></li>
          <li><a href="movies.html" class="nav-link active">MOVIES</a></li>
          <li><a href="../index.html#experiencesSection" class="nav-link">EXPERIENCES</a></li>
          <li><a href="../index.html#offersSection" class="nav-link">OFFERS</a></li>
        </ul>

        <a href="showtimes.html" class="btn-buy-tickets-pill">BUY TICKETS</a>

        <button class="hamburger-menu-btn" id="mobileMenuBtn" aria-label="Toggle Navigation Menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 40px; padding-bottom: 80px;">

    <div style="margin-bottom: 32px;">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; margin-bottom: 24px;">
        <div>
          <span style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--primary); font-weight: 700;">Complete Catalog</span>
          <h1 style="font-size: 2.4rem; margin-top: 4px;">Explore Movies & Showtimes</h1>
        </div>

        <div style="position: relative; width: 100%; max-width: 340px;">
          <input type="text" id="movieSearchInput" class="form-control" placeholder="Search by title..." style="padding-left: 40px; border-radius: var(--radius-full);">
          <svg style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); pointer-events: none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </div>
      </div>

      <div id="genreFilterChips" style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px;">
        <!-- Injected via app.js -->
      </div>
    </div>

    <div id="moviesCatalogGrid" class="movie-grid">
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom" style="border-top: none; padding-top: 0;">
      <div>&copy; 2026 CineX System. Backend REST API on Spring Boot 3.</div>
      <div style="color: var(--text-secondary);">Package: lk.ijse.backend</div>
    </div>
  </footer>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/seat-picker.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
